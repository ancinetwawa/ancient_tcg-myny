<!DOCTYPE html>
<!-- ============================================================
     WEBSITE LAYOUT: what's on each screen.
     Looks are in style.css; behavior is in client.js.
     The id="..." names are how client.js finds each element.
     ============================================================ -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- sizes the page right on phones -->
  <title>Ancient TCG</title> <!-- text on the browser tab -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- WELCOME SCREEN: shown first; asks for a name -->
  <section id="welcome" class="screen">
    <form id="join-form" class="welcome-box" autocomplete="off">
      <h1>Ancient TCG</h1>
      <label for="name-input">Enter your name</label>
      <input id="name-input" type="text" maxlength="20" placeholder="Your name" required autofocus>
      <button type="submit">Enter</button>
      <p id="join-error" class="error" role="alert"></p> <!-- error messages appear here -->
    </form>
  </section>

  <!-- GAME TABLE: shown after joining (starts hidden) -->
  <section id="table" class="screen hidden">

    <!-- The scrollable, zoomable area holding every player's board -->
    <div id="viewport" class="viewport">
      <div id="world-sizer" class="world-sizer"> <!-- sized by client.js so scrolling covers the zoomed table -->
        <div id="world" class="world">           <!-- client.js scales this for zoom and places the boards -->

          <!-- YOUR BOARD (other players' boards are added by client.js) -->
          <div id="my-board" class="board mine">
            <div class="deck-area">
              <button id="deck" class="deck" aria-label="Draw a card">
                <span class="deck-stack"></span>                   <!-- the stack of white cards -->
                <span id="deck-count" class="deck-count"></span>   <!-- "60 cards" label -->
              </button>
            </div>
            <div id="my-field" class="field"></div>               <!-- cards you've played -->
            <div id="you-label" class="board-name"></div>          <!-- your name, bottom left -->
          </div>

        </div>
      </div>
    </div>

    <!-- Things that stay put on screen while the table scrolls -->
    <div id="hand" class="hand my-hand"></div> <!-- your hand, bottom center; client.js fills in the cards -->
    <div id="players" class="players"></div> <!-- other players' chips, top left -->

    <!-- Zoom control, top right -->
    <div class="zoom">
      <button id="zoom-out" aria-label="Zoom out">&minus;</button>
      <span id="zoom-level">100%</span>
      <button id="zoom-in" aria-label="Zoom in">+</button>
    </div>

    <!-- End Turn button. client.js draws its outlines behind the label. -->
    <button id="end-turn" class="frame-btn end-turn"><span id="end-turn-label">End Turn 1</span></button>

    <!-- Play / Cancel: shown next to a card you're about to play -->
    <div id="stage-buttons" class="stage-buttons hidden">
      <button id="play-btn" class="frame-btn"><span>Play</span></button>
      <button id="cancel-btn" class="frame-btn"><span>Cancel</span></button>
    </div>
    <div id="toast" class="toast" role="status"></div> <!-- pop-up messages -->
  </section>

  <script src="/client.js"></script>
</body>
</html>
